# GitHub Codespaces / VS Code Dev Containers 専用の追加定義。
# ルートの docker-compose.yml（Phase3 1.2節の単一マシン構成そのもの）は変更しない
# ── DESIGN_FREEZE.mdの「DB/API/permission-modelの変更は独断で行わない」の対象は
# アプリのアーキテクチャそのものであり、開発環境ツールの追加はこれに当たらないと判断。
# 既存compose(postgres/redis/minio/api/worker/web/caddy)に、エディタが接続する
# 「workspace」コンテナを1つ追加するだけで、既存サービス定義には一切触れない。
services:
  workspace:
    # devcontainer.jsonのfeatures(ghcr.io/devcontainers/features/node:1)経由での
    # Node導入は、dockerComposeFile+image構成では機能インジェクションが効かず
    # nodeコマンド自体が存在しないまま起動することを実機のCodespacesで確認した
    # (2026-08-16、gh codespace sshで直接検証しnode: command not foundを確認)。
    # featuresに頼らず、Node 22が最初から入っている公式イメージを直接使う。
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/career-compass-os:cached
      # ホストのDockerソケットをそのままマウントする(docker-outside-of-docker方式)。
      # postgres/api/worker/web/caddyはworkspaceとは別の兄弟コンテナとして動くため、
      # workspace内のターミナルから `docker compose ps` 等で状態確認したい場合、
      # dockerクライアント自体とソケットへのアクセスが要る(2026-08-16、実機のCodespacesで
      # ブラウザ経由の動作確認中に docker: command not found で発覚)。
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      # api/webはDocker内部ネットワーク上で稼働するため、コンテナ名で到達する
      - API_INTERNAL_HOST=api
      - WEB_INTERNAL_HOST=web
    depends_on:
      - postgres
      - redis
      - minio
