# 羅針盤キャリアOS ― 単一マシン構成（Phase3 1.2節）
# PostgreSQL / Redis / MinIO / アプリサーバー / ワーカー / Caddy を1台のマシン上で一括起動する。
# 外部に公開するのは Caddy のポートのみ。DB/Redis/MinIOはDocker内部ネットワークのみで到達可能。

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # POSTGRES_USER/PASSWORD はpostgres公式イメージの初期化用スーパーユーザー
      # （postgresの仕様上、常にスーパーユーザーとして作成される。変更不可）。
      # アプリが実際に接続する非スーパーユーザーロール（APP_DB_USER）は
      # infra/postgres/init/01-create-app-role.sh が初回起動時に別途作成する
      # （Phase3 17章RLSはスーパーユーザー接続では機能しないため。2026-08-14、
      # RLS動作確認テストでapp_backendがスーパーユーザーのままRLSを素通りしていたことが発覚し追加）。
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # 初回起動時のみ initdb + infra/postgres/init のロール作成スクリプトが走るため、
      # ボリュームが新規(クラウド上のCodespaces初回起動やクリーンなVolume等)だと
      # 通常の interval×retries=50秒では間に合わないことがある(2026-08-16、実機の
      # GitHub Codespacesで dependency failed to start: postgres is unhealthy により
      # コンテナ作成自体が失敗して発覚)。start_period中の失敗はretriesを消費しないため、
      # 2回目以降の起動(ボリューム再利用時)の検知速度には影響しない。
      start_period: 60s
    # Step 0で追加: Prisma migrate / ローカルJestからの接続用に127.0.0.1のみへ公開する
    # （0.0.0.0ではないためLAN上の他端末からは到達不可。1.3節「外部に公開するのはCaddyのみ」の
    # 「外部」＝LAN/インターネットを指しており、ループバックはこの原則に抵触しない、との判断）。
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 上記postgresと同じ理由でループバックのみ公開（RateLimiter/SessionServiceの統合テスト用）
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${API_INTERNAL_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${WEB_INTERNAL_PORT}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
